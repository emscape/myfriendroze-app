name: myfriendroze_admin
description: Admin app for managing products and events for MyFriendRoze

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  go_router: ^16.2.1
  
  # Image handling
  image_picker: ^1.2.0
  cached_network_image: ^3.3.0
  
  # Form handling
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.2.0

  # State management
  provider: ^6.1.1

  # Utilities
  uuid: ^4.2.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  http: ^1.1.0
  
  # Speech to text
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  mockito: ^5.4.0
  fake_cloud_firestore: ^4.1.0+1
  firebase_storage_mocks: ^0.8.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
