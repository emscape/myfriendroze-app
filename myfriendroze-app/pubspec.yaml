name: myfriendroze_admin
description: Admin app for managing products and events for MyFriendRoze

publish_to: 'none'

# The +N build number here is a static fallback for local `flutter run`/
# `flutter build` only. Every real deploy goes through scripts/deploy-web.sh,
# which overrides it with the actual git commit count at build time — see
# that script and the Deployment section of CLAUDE.md for why.
version: 1.0.0+34

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  # Upper-bounded below 6.4.0, not just ^6.0.1: cloud_firestore >=6.4.0 jumps
  # its firebase_core_platform_interface requirement to ^7.0.0, which pulls
  # in a WriteBatch.update signature fake_cloud_firestore 4.1.1 doesn't
  # support (a plain ^6.0.1 constraint alone still lets `pub upgrade` resolve
  # into that broken range later, even with cloud_functions pinned below).
  # fake_cloud_firestore's own fix for that requires meta ^1.17.0, which
  # conflicts with the meta 1.16.0 this Flutter SDK's flutter_test pins.
  cloud_firestore: ">=6.0.1 <6.4.0"
  firebase_storage: ^13.0.1
  # Pinned exactly (not ^): the FlutterFire packages must move in lockstep on
  # their shared firebase_core_platform_interface version. 6.0.1 is the last
  # cloud_functions release published alongside cloud_firestore 6.0.1 (both
  # 2025-09-01, both requiring firebase_core_platform_interface ^6.0.0) --
  # anything newer drags firebase_core_platform_interface past ^6.0.0, which
  # the cloud_firestore ceiling above can't satisfy, so pub would be forced
  # to pick an older, likely broken cloud_firestore instead.
  # Revisit both this pin and the ceiling above whenever the Flutter SDK
  # (and its pinned meta) is next upgraded.
  cloud_functions: 6.0.1

  # UI & Navigation
  cupertino_icons: ^1.0.2
  go_router: ^16.2.1
  
  # Image handling
  image_picker: ^1.2.0
  cached_network_image: ^3.3.0
  
  # Form handling
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.2.0

  # State management
  provider: ^6.1.1

  # Utilities
  uuid: ^4.2.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  http: ^1.1.0
  package_info_plus: ^8.1.2
  web: ^1.1.0

  # Speech to text
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  mockito: ^5.4.0
  fake_cloud_firestore: ^4.1.0+1
  firebase_storage_mocks: ^0.8.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
  
